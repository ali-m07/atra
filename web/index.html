<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('atra-locale')
          var lang =
            saved === 'en' || saved === 'fa'
              ? saved
              : (navigator.language || '').toLowerCase().indexOf('fa') === 0
                ? 'fa'
                : 'en'
          document.documentElement.lang = lang
          document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr'
          document.title =
            lang === 'fa'
              ? 'آترا، آزمایشگاه شناختی پویایی سیستم‌ها'
              : 'Atra, Cognitive Laboratory for System Dynamics'
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"

    />
    <meta name="theme-color" content="#1A2A4A" />
