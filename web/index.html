<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('atra-locale')
          var lang =
            saved === 'en' || saved === 'fa'
              ? saved
              : (navigator.language || '').toLowerCase().indexOf('fa') === 0
                ? 'fa'
                : 'en'
          document.documentElement.lang = lang
          document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr'
          document.title =
            lang === 'fa'
              ? 'آترا، آزمایشگاه شناختی پویایی سیستم‌ها'
              : 'Atra, Cognitive Laboratory for System Dynamics'
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Atra is a cognitive laboratory for system dynamics and strategic foresight. Structure creates behavior. Think Tank, School, Laboratory."
    />
    <title>Atra, Cognitive Laboratory for System Dynamics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
